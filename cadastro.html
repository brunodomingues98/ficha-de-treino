<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0f">
  <title>Ficha de Treino — Criar conta</title>
  <link rel="icon" href="/assets/images/favicon.ico" type="image/x-icon">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/assets/images/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/assets/css/style.css">
  <style>
    /* Steps */
    .step { display: none; }
    .step.active { display: flex; flex-direction: column; gap: 14px; }

    .step-indicator {
      display: flex;
      gap: 6px;
      justify-content: center;
      margin-bottom: 8px;
    }
    .step-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--border);
      transition: var(--transition);
    }
    .step-dot.active { background: var(--gold); transform: scale(1.3); }
    .step-dot.done  { background: var(--purple-light); }

    .step-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 22px;
      letter-spacing: .04em;
      color: var(--text-primary);
      text-align: center;
    }
    .step-sub {
      font-size: 13px;
      color: var(--text-muted);
      text-align: center;
      margin-top: -8px;
    }

    /* Opção de seleção */
    .opcao-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .opcao-grid.cols-1 { grid-template-columns: 1fr; }

    .opcao-btn {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px 10px;
      text-align: center;
      cursor: pointer;
      transition: var(--transition);
      font-family: inherit;
      color: var(--text-secondary);
    }
    .opcao-btn .opcao-icon { font-size: 28px; display: block; margin-bottom: 6px; }
    .opcao-btn .opcao-label { font-size: 13px; font-weight: 600; }
    .opcao-btn .opcao-desc  { font-size: 11px; color: var(--text-muted); margin-top: 3px; }
    .opcao-btn.selected {
      border-color: var(--gold);
      background: rgba(247,207,73,.08);
      color: var(--text-primary);
    }
    .opcao-btn.selected .opcao-desc { color: var(--gold-light); }

    /* Range input */
    .range-group { display: flex; flex-direction: column; gap: 6px; }
    .range-value {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 36px;
      letter-spacing: .04em;
      color: var(--gold);
      text-align: center;
    }
    .range-unit { font-size: 14px; color: var(--text-muted); }
    input[type="range"] {
      width: 100%;
      accent-color: var(--gold);
      height: 6px;
    }
    .range-minmax {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-muted);
    }

    /* Tela de loading geração */
    .gerando-treino {
      text-align: center;
      padding: 24px 0;
    }
    .gerando-treino .spinner { margin: 0 auto 16px; }
    .gerando-treino p { color: var(--text-secondary); font-size: 14px; }
  </style>
</head>
<body>

<div class="login-page" style="display:flex;padding:20px 16px">
  <div class="login-card" style="max-width:440px;width:100%">

    <div class="login-logo">
      <div class="brand">Ficha de Treino</div>
      <p>Crie sua conta gratuita</p>
    </div>

    <!-- Indicador de steps -->
    <div class="step-indicator" id="step-indicator">
      <div class="step-dot active" data-step="0"></div>
      <div class="step-dot" data-step="1"></div>
      <div class="step-dot" data-step="2"></div>
      <div class="step-dot" data-step="3"></div>
      <div class="step-dot" data-step="4"></div>
    </div>

    <div class="login-error" id="erro-cadastro"></div>

    <!-- STEP 0: Dados da conta -->
    <div class="step active" id="step-0">
      <div class="step-title">Seus dados</div>
      <div class="step-sub">Crie seu acesso ao app</div>

      <div class="field-group">
        <label>Nome</label>
        <input type="text" id="nome" placeholder="Como você quer ser chamado(a)">
      </div>
      <div class="field-group">
        <label>E-mail</label>
        <input type="email" id="email" placeholder="seu@email.com" autocomplete="email">
      </div>
      <div class="field-group">
        <label>Senha</label>
        <input type="password" id="senha" placeholder="Mínimo 6 caracteres" autocomplete="new-password">
      </div>

      <button class="btn-primary" id="btn-step-0">Continuar →</button>
      <p style="text-align:center;font-size:12px;color:var(--text-muted)">
        Já tem conta? <a href="/login.html" style="color:var(--gold)">Entrar</a>
      </p>
    </div>

    <!-- STEP 1: Gênero -->
    <div class="step" id="step-1">
      <div class="step-title">Qual o seu gênero?</div>
      <div class="opcao-grid">
        <button class="opcao-btn" data-field="genero" data-value="masculino">
          <span class="opcao-icon">♂️</span>
          <span class="opcao-label">Masculino</span>
        </button>
        <button class="opcao-btn" data-field="genero" data-value="feminino">
          <span class="opcao-icon">♀️</span>
          <span class="opcao-label">Feminino</span>
        </button>
        <button class="opcao-btn" data-field="genero" data-value="outro" style="grid-column:1/-1">
          <span class="opcao-label">Prefiro não informar</span>
        </button>
      </div>
    </div>

    <!-- STEP 2: Métricas -->
    <div class="step" id="step-2">
      <div class="step-title">Suas medidas</div>

      <div class="range-group">
        <label style="font-size:12px;font-weight:600;color:var(--text-muted)">IDADE</label>
        <div class="range-value"><span id="val-idade">25</span> <span class="range-unit">anos</span></div>
        <input type="range" id="range-idade" min="14" max="80" value="25">
        <div class="range-minmax"><span>14</span><span>80</span></div>
      </div>

      <div class="range-group">
        <label style="font-size:12px;font-weight:600;color:var(--text-muted)">ALTURA</label>
        <div class="range-value"><span id="val-altura">170</span> <span class="range-unit">cm</span></div>
        <input type="range" id="range-altura" min="140" max="220" value="170">
        <div class="range-minmax"><span>140cm</span><span>220cm</span></div>
      </div>

      <div class="range-group">
        <label style="font-size:12px;font-weight:600;color:var(--text-muted)">PESO</label>
        <div class="range-value"><span id="val-peso">70</span> <span class="range-unit">kg</span></div>
        <input type="range" id="range-peso" min="40" max="160" value="70">
        <div class="range-minmax"><span>40kg</span><span>160kg</span></div>
      </div>

      <button class="btn-primary" id="btn-step-2">Continuar →</button>
    </div>

    <!-- STEP 3: Objetivo -->
    <div class="step" id="step-3">
      <div class="step-title">Qual o seu objetivo?</div>
      <div class="opcao-grid cols-1">
        <button class="opcao-btn" data-field="objetivo" data-value="hipertrofia">
          <span class="opcao-icon">💪</span>
          <span class="opcao-label">Ganho de massa muscular</span>
          <div class="opcao-desc">Treinos de força com mais volume e carga progressiva</div>
        </button>
        <button class="opcao-btn" data-field="objetivo" data-value="emagrecimento">
          <span class="opcao-icon">🔥</span>
          <span class="opcao-label">Perda de peso</span>
          <div class="opcao-desc">Mix de musculação e cardio para queima calórica</div>
        </button>
        <button class="opcao-btn" data-field="objetivo" data-value="condicionamento">
          <span class="opcao-icon">⚡</span>
          <span class="opcao-label">Condicionamento físico</span>
          <div class="opcao-desc">Equilíbrio entre força, resistência e mobilidade</div>
        </button>
      </div>
    </div>

    <!-- STEP 4: Nível -->
    <div class="step" id="step-4">
      <div class="step-title">Qual o seu nível?</div>
      <div class="opcao-grid cols-1">
        <button class="opcao-btn" data-field="nivel" data-value="iniciante">
          <span class="opcao-icon">🌱</span>
          <span class="opcao-label">Iniciante</span>
          <div class="opcao-desc">Menos de 6 meses de treino ou voltando após pausa longa</div>
        </button>
        <button class="opcao-btn" data-field="nivel" data-value="intermediario">
          <span class="opcao-icon">⚡</span>
          <span class="opcao-label">Intermediário</span>
          <div class="opcao-desc">6 meses a 2 anos treinando com regularidade</div>
        </button>
        <button class="opcao-btn" data-field="nivel" data-value="avancado">
          <span class="opcao-icon">🔥</span>
          <span class="opcao-label">Avançado</span>
          <div class="opcao-desc">Mais de 2 anos com treino consistente</div>
        </button>
      </div>
    </div>

    <!-- Gerando treino -->
    <div class="step" id="step-gerando">
      <div class="gerando-treino">
        <div class="spinner"></div>
        <p>Montando seu treino personalizado...<br>
        <span style="color:var(--text-muted);font-size:12px">Isso pode levar alguns segundos</span></p>
      </div>
    </div>

  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, updateProfile }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, setDoc }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { gerarTreinos } from "/assets/js/treinos-autonomo.js";

const firebaseConfig = {
  apiKey:            "AIzaSyDldCAsRyzMoZ3UJHaqpO-o_jdE_hWF5Cw",
  authDomain:        "ficha-de-treino-ba542.firebaseapp.com",
  projectId:         "ficha-de-treino-ba542",
  storageBucket:     "ficha-de-treino-ba542.firebasestorage.app",
  messagingSenderId: "1725577428",
  appId:             "1:1725577428:web:eace2780d5ce3ca669a341"
};

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

// ── Estado ─────────────────────────────────────────────────
let currentStep = 0;
const perfil = { nome:'', email:'', senha:'', genero:'', idade:25, altura:170, peso:70, objetivo:'', nivel:'' };

const errEl = document.getElementById('erro-cadastro');
function showErro(msg) { errEl.textContent = msg; errEl.classList.add('show'); }
function hideErro() { errEl.classList.remove('show'); }

// ── Ranges ────────────────────────────────────────────────
['idade','altura','peso'].forEach(campo => {
  const range = document.getElementById(`range-${campo}`);
  const val   = document.getElementById(`val-${campo}`);
  range.addEventListener('input', () => {
    val.textContent = range.value;
    perfil[campo] = parseInt(range.value);
  });
});

// ── Opções de seleção ─────────────────────────────────────
document.querySelectorAll('.opcao-btn[data-field]').forEach(btn => {
  btn.addEventListener('click', () => {
    const field = btn.dataset.field;
    document.querySelectorAll(`.opcao-btn[data-field="${field}"]`)
      .forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    perfil[field] = btn.dataset.value;

    // Avança automaticamente (exceto métricas)
    if (field !== 'metricas') {
      setTimeout(() => avancarStep(), 350);
    }
  });
});

// ── Indicador de steps ────────────────────────────────────
function atualizarIndicador() {
  document.querySelectorAll('.step-dot').forEach((dot, i) => {
    dot.classList.toggle('active', i === currentStep);
    dot.classList.toggle('done', i < currentStep);
  });
}

// ── Navegação ─────────────────────────────────────────────
function irParaStep(n) {
  document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
  const next = document.getElementById(`step-${n}`);
  if (next) { next.classList.add('active'); currentStep = n; }
  atualizarIndicador();
  hideErro();
}

function avancarStep() {
  if (currentStep === 4) {
    criarConta();
  } else {
    irParaStep(currentStep + 1);
  }
}

// ── Step 0: validação de dados da conta ───────────────────
document.getElementById('btn-step-0').addEventListener('click', () => {
  perfil.nome  = document.getElementById('nome').value.trim();
  perfil.email = document.getElementById('email').value.trim();
  perfil.senha = document.getElementById('senha').value;

  if (!perfil.nome || !perfil.email || !perfil.senha)
    return showErro('Preencha todos os campos.');
  if (perfil.senha.length < 6)
    return showErro('Senha deve ter ao menos 6 caracteres.');
  hideErro();
  irParaStep(1);
});

// ── Step 2: botão continuar ───────────────────────────────
document.getElementById('btn-step-2').addEventListener('click', () => {
  perfil.idade  = parseInt(document.getElementById('range-idade').value);
  perfil.altura = parseInt(document.getElementById('range-altura').value);
  perfil.peso   = parseInt(document.getElementById('range-peso').value);
  irParaStep(3);
});

// ── Criar conta + gerar treino ────────────────────────────
async function criarConta() {
  document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
  document.getElementById('step-gerando').classList.add('active');
  document.querySelectorAll('.step-dot').forEach(d => d.style.display = 'none');

  try {
    const cred = await createUserWithEmailAndPassword(auth, perfil.email, perfil.senha);
    await updateProfile(cred.user, { displayName: perfil.nome });

    // Gera treinos baseados no perfil
    const treinos = gerarTreinos(perfil);

    await setDoc(doc(db, 'users', cred.user.uid), {
      uid: cred.user.uid,
      name: perfil.nome,
      email: perfil.email,
      role: 'autonomo',
      perfil: {
        genero:  perfil.genero,
        idade:   perfil.idade,
        altura:  perfil.altura,
        peso:    perfil.peso,
        objetivo: perfil.objetivo,
        nivel:   perfil.nivel,
      },
      treinos,
      createdAt: new Date().toISOString()
    });

    window.location.href = '/index.html';
  } catch (e) {
    document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.step-dot').forEach(d => d.style.display = '');
    irParaStep(0);
    const map = {
      'auth/email-already-in-use': 'Esse e-mail já está cadastrado. Tente fazer login.',
      'auth/invalid-email':        'E-mail inválido.',
      'auth/weak-password':        'Senha muito fraca.',
      'auth/network-request-failed': 'Sem conexão. Verifique sua internet.',
    };
    showErro(map[e.code] || 'Erro: ' + e.message);
  }
}
</script>
<script src="/assets/js/pwa.js"></script>
</body>
</html>
